<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryMagic Hub - Генератор детских сказок</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F7FAFC;
            color: #2D3748;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #4A5568;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #4C51BF;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #434190;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .actions button {
            background-color: #319795;
        }
        .actions button:hover {
            background-color: #2C7A7B;
        }
        #loading {
            display: none;
            text-align: center;
            font-weight: bold;
            color: #D69E2E;
            margin-top: 15px;
        }
        .book-preview {
            margin-top: 30px;
            border-top: 2px solid #E2E8F0;
            padding-top: 20px;
        }
        .chapter-box {
            background: #EDF2F7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .chapter-box img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 StoryMagic Hub</h1>
    
    <!-- Форма генерации сказки -->
    <form id="storyForm">
        <div class="form-group">
            <label for="hero_name">Имя главного героя:</label>
            <input type="text" id="hero_name" name="hero_name" value="Алиса" required>
        </div>

        <div class="form-group">
            <label for="age">Возраст ребенка:</label>
            <input type="number" id="age" name="age" value="7" required>
        </div>

        <div class="form-group">
            <label for="theme">Тема / Сюжет сказки:</label>
            <input type="text" id="theme" name="theme" value="Волшебное путешествие в звездный лес" required>
        </div>

        <div class="form-group">
            <label for="style">Визуальный стиль иллюстраций:</label>
            <input type="text" id="style" name="style" value="Watercolor children book illustration" required>
        </div>

        <div class="form-group">
            <label for="lang">Язык книги:</label>
            <select id="lang" name="lang">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="pl">Polski</option>
                <option value="ro">Română</option>
                <option value="it">Italiano</option>
                <option value="tr">Türkçe</option>
            </select>
        </div>

        <div class="form-group">
            <label for="photo">Фотография ребенка (для портретного сходства):</label>
            <input type="file" id="photo" name="photo" accept="image/*">
        </div>

        <button type="submit">✨ Сгенерировать сказку</button>
    </form>

    <div id="loading">Генерация сказки и иллюстраций (это может занять около минуты)...</div>

    <!-- Область отображения книги и кнопок экспорта/заказа -->
    <div id="resultSection" class="book-preview" style="display: none;">
        <h2 id="bookTitle"></h2>
        
        <div class="actions">
            <button id="exportEpubBtn">📥 Скачать ePub</button>
            <button id="exportPdfBtn">📄 Печатный PDF (5.5x8.5)</button>
            <button id="orderHardcoverBtn" style="background-color: #DD6B20;">📦 Заказать Hardcover (Lulu Sandbox)</button>
        </div>

        <div id="chaptersContainer" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    let currentStoryData = null;

    // Обработка отправки формы генерации
    document.getElementById('storyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const loadingDiv = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        loadingDiv.style.display = 'block';
        resultSection.style.display = 'none';

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            loadingDiv.style.display = 'none';

            if (data.success) {
                // Сохраняем данные книги для экспорта и заказа
                currentStoryData = {
                    title: data.title,
                    language_code: document.getElementById('lang').value,
                    author: "StoryMagic Hub",
                    dedication_text: data.dedication_text || "",
                    psychology_questions: data.psychology_questions || [],
                    chapters: data.pages.map(p => ({
                        chapter_number: p.page_number,
                        title: p.title,
                        paragraphs: p.paragraphs,
                        image_url: p.image_url
                    })),
                    is_paid: true // Устанавливаем true для тестов экспорта и печати
                };

                document.getElementById('bookTitle').innerText = data.title;
                
                const container = document.getElementById('chaptersContainer');
                container.innerHTML = '';

                data.pages.forEach(page => {
                    const box = document.createElement('div');
                    box.className = 'chapter-box';
                    box.innerHTML = `
                        <h3>Глава ${page.page_number}: ${page.title}</h3>
                        <p>${page.text.replace(/\n/g, '<br>')}</p>
                        ${page.image_url ? `<div style="text-align:center;"><img src="${page.image_url}" alt="${page.title}"></div>` : ''}
                    `;
                    container.appendChild(box);
                });

                resultSection.style.display = 'block';
            } else {
                alert('Ошибка генерации: ' + (data.error || 'Неизвестная ошибка'));
            }
        } catch (err) {
            loadingDiv.style.display = 'none';
            console.error(err);
            alert('Произошла ошибка при связи с сервером.');
        }
    });

    // Скачивание ePub
    document.getElementById('exportEpubBtn').addEventListener('click', async () => {
        if (!currentStoryData) return;
        try {
            const res = await fetch('/api/export-epub', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentStoryData)
            });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'StoryMagic_Book.epub';
                a.click();
            } else {
                alert('Ошибка при скачивании ePub');
            }
        } catch (e) {
            console.error(e);
            alert('Ошибка сети');
        }
    });

    // Скачивание Print-Ready PDF (5.5x8.5)
    document.getElementById('exportPdfBtn').addEventListener('click', async () => {
        if (!currentStoryData) return;
        try {
            const res = await fetch('/api/export-print-pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentStoryData)
            });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'StoryMagic_Print_Ready_5.5x8.5.pdf';
                a.click();
            } else {
                alert('Ошибка при создании PDF');
            }
        } catch (e) {
            console.error(e);
            alert('Ошибка сети');
        }
    });

    // Отправка заказа в Lulu Sandbox
    document.getElementById('orderHardcoverBtn').addEventListener('click', async () => {
        if (!currentStoryData) {
            alert('Сначала сгенерируйте книгу!');
            return;
        }

        const email = prompt('Введите ваш Email для тестового заказа:', 'test@example.com');
        if (!email) return;

        const street = prompt('Улица и дом доставки:', '123 Test Street');
        if (!street) return;

        const city = prompt('Город:', 'London');
        if (!city) return;

        const postcode = prompt('Почтовый индекс:', 'E1 6AN');
        if (!postcode) return;

        const shippingAddress = {
            name: "Test Customer",
            street1: street,
            city: city,
            postcode: postcode,
            country_code: "GB"
        };

        const payload = {
            story: currentStoryData,
            contact_email: email,
            shipping_address: shippingAddress
        };

        try {
            const response = await fetch('/api/lulu-create-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (response.ok && result.success) {
                alert('Заказ успешно отправлен в Sandbox Lulu! Ответ сервера записан в консоль (F12).');
                console.log('Lulu response:', result.lulu_response);
            } else {
                alert('Ошибка при оформлении заказа: ' + (result.detail || 'Неизвестная ошибка'));
            }
        } catch (err) {
            console.error(err);
            alert('Произошла ошибка соединения с сервером.');
        }
    });
</script>

</body>
</html>
